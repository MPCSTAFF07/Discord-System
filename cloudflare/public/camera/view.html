<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>選手カメラ</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f5f5f5;color:#171717;font:14px system-ui}main{max-width:1000px;margin:auto}h1{font-size:20px}button,input,select{font:inherit;padding:9px;border:1px solid #aaa;background:#fff;border-radius:3px}button{cursor:pointer}input{min-width:100px}video{width:100%;max-height:65vh;background:#111}table{width:100%;border-collapse:collapse;background:#fff}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}p{line-height:1.8}#status{white-space:pre-wrap}a{color:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}@media(max-width:700px){body{padding:14px}table{font-size:12px}td,th{padding:7px}input{width:130px}}body{background:transparent;padding:0;overflow:hidden}main{max-width:none}video{display:block;max-height:none;width:100vw;height:100vh;object-fit:cover;background:transparent}#status{position:fixed;left:8px;right:8px;top:8px;margin:0;padding:8px;color:#fff;background:rgba(0,0,0,.8);font:13px/1.5 system-ui}</style><main><video id="video" autoplay playsinline muted></video><p id="status" role="status"></p></main><script src="/camera/camera.js"></script></html>
